# MaxRL with baseline subtraction on Math12K (MATH-500 validation), from the base model.
defaults: base.yaml

checkpointing:
  save_period: 1000
  keep_top_k: null

data:
  _override_: true
  max_input_seq_length: ${policy.max_total_sequence_length}
  shuffle: true
  num_workers: 1
  use_multiple_dataloader: false
  train:
    dataset_name: ResponseDataset
    data_path: ${oc.env:RL_TRAIN_FILE}
    input_key: problem
    output_key: answer
    split: train
  validation:
    dataset_name: ResponseDataset
    data_path: ${oc.env:RL_VAL_FILE}
    input_key: problem
    output_key: answer
    split: train
  default:
    prompt_file: null
    system_prompt_file: null
    processor: math_hf_data_processor
    env_name: math
