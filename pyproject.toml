[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-training"
version = "0.1.0"
description = "Training foundation models with a single algorithm: static data and RL generations under one weighted likelihood loss."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Trainer and data layer, pinned to the environment the paper's unified runs used (Python 3.12).
dependencies = [
    "torch==2.11.0",
    "transformers==4.57.6",
    "tokenizers==0.22.2",
    "safetensors==0.8.0",
    "numpy==2.5.2",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
# vLLM generator (unified_training.gen_service) and the reasoning-puzzle evaluator (nl_tower.evaluate).
generator = [
    "vllm==0.23.0",
    "math-verify==0.9.0",
    "latex2sympy2_extended==1.11.0",
]
# 124M pretraining-data preparation (unified_training.pretrain); xxhash only for the shard byte-identity check.
pretrain = [
    "zstandard",
    "xxhash",
]
# Controlled-setting checkpoint downloads (experiments/controlled).
controlled = [
    "huggingface_hub[cli]==0.36.2",
]
# The benchmark harness (unified_training.evals) needs its own environment: its vLLM pin requires another torch than
# the trainer's, so its pins are in requirements-evals.txt (README, Install). Real-world data preparation
# (experiments/realworld/prepare.sh) runs in that environment too.
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["unified_training*", "nl_tower*"]

[tool.setuptools.package-data]
nl_tower = ["*.json"]
"unified_training.evals" = ["patches/*.patch", "tasks/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
